version: 1
description: Execution-side references for the public contracts. This file is not part of the model prompt.
bindings:
  - id: skill_001
    executor:
      callable: zeno_skills.skills.navigate
      invocation: navigate(rig, (target_pose.x, target_pose.y, target_pose.yaw_deg))
    verifier:
      available: partial_internal_simulator_check
      evidence: The function raises SkillFailure when route planning fails and checks a carried object for dropping; final pose needs a separate graph-runner check.

  - id: skill_002
    executor:
      callable: zeno_skills.skills.open_articulated
      invocation: open_articulated(rig, part)
    verifier:
      available: internal_simulator_check
      evidence: The function checks the measured joint value against the annotated open target.

  - id: skill_003
    executor:
      callable: zeno_skills.skills.close_articulated
      invocation: close_articulated(rig, part)
    verifier:
      available: internal_simulator_check
      evidence: The function checks the measured joint value against the annotated closed target.

  - id: skill_004
    executor:
      callable: zeno_skills.skills.pick
      invocation: pick(rig, object)
    verifier:
      available: internal_simulator_check
      evidence: Pick checks the grasp after lifting; check_held detects later slip during carry.

  - id: skill_005
    executor:
      callable: zeno_skills.skills.push
      invocation: Resolve the current support beneath object; normalize displacement_xy to direction and distance; call push(rig, object, support, direction, distance).
    verifier:
      available: internal_simulator_check
      evidence: Push measures displacement after each push leg and raises SkillFailure if the object does not move.

  - id: skill_006
    executor:
      callable: zeno_skills.skills.place
      invocation: place(rig, object, "in:" + container)
    verifier:
      available: internal_simulator_check
      evidence: Place checks geometry.inside on simulator state after release.

  - id: skill_007
    executor:
      callable: zeno_skills.skills.place_on
      invocation: place_on(rig, object, support, hint=hint_xy)
    verifier:
      available: internal_simulator_check
      evidence: Place or place_flat checks geometry.on on simulator state after release.

  - id: skill_008
    executor:
      callable: zeno_skills.skills.press_microwave_start
      invocation: press_microwave_start(rig, appliance)
    verifier:
      available: internal_simulator_check
      evidence: The skill checks button contact and sets thermal.active; goal temperature is checked later by the task evaluator.

  - id: skill_009
    executor:
      callable: zeno_skills.skills.cycle_microwave_door
      invocation: cycle_microwave_door(rig, appliance)
    verifier:
      available: internal_simulator_check
      evidence: The skill checks the measured joint value at both powered-door targets.
