---
id: skill_009
name: Open and reclose a microwave door for inspection
description: Press the annotated microwave door control, open the powered door for
  inspection, and close it again.
inputs:
  appliance: Microwave
requires:
- The microwave has an annotated door button and powered hinge.
- The microwave door starts closed.
- The door button and inspection pose are reachable at execution time.
achieves:
- The microwave door has been opened and returned to the closed state.
outcomes:
  success: The powered door reaches its open target and then its closed target.
  failure: The button cannot be reached, or the powered door misses either target.
executor:
  callable: zeno_skills.skills.cycle_microwave_door
  invocation: cycle_microwave_door(rig, appliance)
verifier:
  available: internal_simulator_check
  evidence: The skill checks the measured joint value at both powered-door targets.
connections:
- to:
  - skill_008
  when: The prepared food is already in the microwave and the inspection door cycle
    has finished.
  basis: scripted_policy
