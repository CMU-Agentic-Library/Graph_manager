---
id: skill_006
name: Place a held object inside a container
description: Release a held object into an annotated container.
inputs:
  object: MovableObject
  container: ContainerObject
requires:
- The robot holds the specified object.
- The container exists in the current scene and has a container annotation.
- The container opening is accessible and a placement pose is reachable at execution
  time.
achieves:
- The specified object is inside the container.
- The gripper is empty.
outcomes:
  success: The object is released and measured inside the container.
  failure: The placement pose cannot be reached, or the released object is not inside
    the container.
executor:
  callable: zeno_skills.skills.place
  invocation: place(rig, object, "in:" + container)
verifier:
  available: internal_simulator_check
  evidence: Place checks geometry.inside on simulator state after release.
connections: []
