---
id: skill_008
name: Start heating food in a microwave
description: Press the annotated microwave start button to begin heating food already
  inside its cavity.
inputs:
  appliance: Microwave
requires:
- The microwave has annotated controls and a configured thermal task state.
- The microwave door is closed.
- At least one configured food object is inside the microwave cavity.
- The start button is reachable at execution time.
achieves:
- Microwave heating is active.
outcomes:
  success: The start button is reached and the thermal task state becomes active.
  failure: The door is open, no configured food is inside, or the button cannot be
    reached.
executor:
  callable: zeno_skills.skills.press_microwave_start
  invocation: press_microwave_start(rig, appliance)
verifier:
  available: internal_simulator_check
  evidence: The skill checks button contact and sets thermal.active; goal temperature
    is checked later by the task evaluator.
connections: []
