---
version: 1
types:
  RobotPose2D:
    x: number
    y: number
    yaw_deg: number
  Vector2:
    x: number
    y: number
  OptionalVector2: 'null or {x: number, y: number}'
  ArticulatedPart: name of an annotated door, drawer, or appliance door in the current
    scene
  MovableObject: name of an annotated movable object in the current scene
  ContainerObject: name of an annotated movable object with a container profile
  SupportSurface: name or resolved alias of an annotated support surface
  Microwave: name of an annotated microwave with the required controls
