[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-manager"
version = "0.1.0"
description = "Skill graph planning and execution for ZenoBench"
requires-python = ">=3.12"
dependencies = ["deepseek-harness-sdk==0.1.5rc1"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
graph-manager-plan = "graph_manager.cli:main"

[tool.setuptools.packages.find]
include = ["graph_manager*"]

[tool.setuptools.package-data]
graph_manager = [
    "harness_profile/*.yml",
    "vendor/zenobench/COMMIT",
    "vendor/zenobench/tasks.json",
    "vendor/zenobench/skills/*/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
