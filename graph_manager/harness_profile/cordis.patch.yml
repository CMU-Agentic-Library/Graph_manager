# Keep Harness session persistence and compaction and its skill loader, but give the
# planner no other tools. The skill root is set per session by the adapter.
# A later patch may explicitly opt in to additional capabilities.
- id: system-prompt
  config:
    personaPrefix: You are a robot task planner. Return the requested JSON plan.
    personaSuffix: ''
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
