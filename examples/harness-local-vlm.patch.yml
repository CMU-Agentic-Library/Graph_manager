# Example DeepSeek Harness profile patch for the server in examples/vllm-qwen3.5-4b.compose.yml.
# Copy it and edit baseURL and the model ID if you serve a different model.
# This configures Harness, not the Skill Library or a task graph.
- id: llm-pi-ai
  config:
    providers:
      lab-vlm:
        apiKeyEnv: LAB_VLM_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8001/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3.5-4b
            input: [text, image]
